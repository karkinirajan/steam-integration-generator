[project]
name = "steam-integration-api"
version = "2.0.0"
description = "The API behind the STEAM Integration Generator: STEAM ideas and 5E lesson plans from the Google Gemini API, with DOCX and PDF export."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.7",
    "google-genai>=3.2.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "httpx>=0.28.1",
]

[tool.uv]
python-preference = "only-managed"
package = false

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The two prompt templates are long paragraphs of prose, carried over unchanged from the original application.
"app/core/prompts.py" = ["E501"]
# One mutant per line: wrapping would hide which text is replaced by which.
"tests/mutation/*_mutants.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["docx.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Same google-genai escape warning as in app/core/gemini.py; tests/test_gemini.py imports google.genai directly.
filterwarnings = ["ignore:.*invalid escape sequence:SyntaxWarning"]
