[project]
name = "steam-integration-generator"
version = "1.0.0"
description = "STEAM integration ideas and 5E lesson plans from the Google Gemini API: a desktop app and a browser page."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.2.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
]

[project.scripts]
steam-generator = "steam_generator.app:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_generator"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The two prompt templates are long paragraphs of prose, carried over unchanged from the original application.
"src/steam_generator/prompts.py" = ["E501"]
# One mutant per line: wrapping would hide which text is replaced by which.
"tests/mutation/*_mutants.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["docx.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
