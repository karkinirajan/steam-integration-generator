name: ci

on:
  push:
    branches: [main, "chore/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t steam-generator .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 3000:3000 steam-generator
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3000/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/verify -H 'Content-Type: application/json' -d '{"provider":"groq","model":"m"}')" = 401
          docker rm -f app
